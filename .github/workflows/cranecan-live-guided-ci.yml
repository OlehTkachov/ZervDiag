name: CraneCAN Live Guided CI

# Windows gate for receive-only Live Guided and passive network discovery.
on:
  push:
    branches:
      - feature/live-guided-can
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: CraneCANAnalyzer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore smoke tests
        run: dotnet restore tests/CraneCAN.SmokeTests/CraneCAN.SmokeTests.csproj

      - name: Build smoke tests
        run: dotnet build tests/CraneCAN.SmokeTests/CraneCAN.SmokeTests.csproj -c Release --no-restore

      - name: Run smoke tests
        run: dotnet run --project tests/CraneCAN.SmokeTests/CraneCAN.SmokeTests.csproj -c Release --no-build

      - name: Build WPF application
        run: dotnet build src/CraneCAN.App/CraneCAN.App.csproj -c Release

      - name: Verify full self-contained Windows publish
        shell: pwsh
        run: ./build-windows.ps1
